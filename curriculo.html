<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currículo | João Gabriel de Mello</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050b18;
      --card: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
      --primary: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0f172a, var(--bg));
      color: var(--text);
    }

    header {
      padding: 2.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 span { color: var(--primary); }

    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: .8rem 1.4rem;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      transition: .3s;
    }

    .btn:hover { transform: translateY(-3px); }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 3rem 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    iframe {
      width: 100%;
      height: 85vh;
      border: none;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <h1>Currículo <span>João Gabriel</span></h1>
    <p>Analista de TI Jr | Service Desk | Suporte Técnico</p>

    <a class="btn" href="index.html">⬅ Voltar ao Portfólio</a>
  </header>

  <main>
    <div class="card">
      <iframe src="Curriculo João Gabriel de Mello.pdf"></iframe>
    </div>
  </main>

  <footer>
    © 2026 • João Gabriel de Mello
  </footer>

</body>
</html>
